  # ============================================================
  /admin/rbac/permissions:
    get:
      summary: Permission catalog (66 codes + Thai/English labels) — perm sys.role.manage
      tags: [RBAC Admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [code, module, labelTh, labelEn]
                  properties:
                    code: { type: string, example: 'sales.tax_invoice.create' }
                    module: { type: string, example: 'sales' }
                    labelTh: { type: string }
                    labelEn: { type: string }
  /admin/rbac/roles:
    get:
      summary: List roles for the target company (SUPER_ADMIN excluded) — perm sys.role.manage
