# ============================================================
# /mcp — Model Context Protocol (MCP) HTTP transport (M2)
# Auth: X-Api-Key (ApiKeyOnlyPolicy — same posture as /api/v1/*; JWT not accepted).
# Rate-limit: per-key 120 req/min (same PerApiKeyRateLimitPolicy as /api/v1/*).
# Intended for mcp-kind keys only (read + create-draft tools; no post/finalise operations).
# ============================================================
  /mcp:
    post:
      summary: MCP server endpoint (Model Context Protocol over HTTP — streamable transport)
      tags: [MCP]
      security: [{ ApiKeyAuth: [] }]
      description: |
        Model Context Protocol (MCP) HTTP streamable transport endpoint (M2).
        Accepts MCP JSON-RPC 2.0 messages from AI agents (e.g. Claude). Not a conventional REST
        resource — request/response bodies are MCP protocol envelopes, not a fixed application schema.
        Auth: `X-Api-Key` header required (ApiKeyOnlyPolicy); JWT is rejected on this path.
        Rate-limit: per-key sliding window 120 req/min (same policy as /api/v1/*).
        Recommended key kind: `mcp` (read + create-draft scopes; cannot invoke post/finalise operations).

        **Tool surface (TeasMcpTools.cs).** Each tool carries `[Authorize(Policy = "apiperm:<scope>")]`
        and is a thin wrapper over the same Application services as /api/v1. WRITE SAFETY: only
        read + create-draft tools exist — no post/issue/send tool — and `mcp`-kind keys structurally
        hold no `.post` scope (M1 guard), so an agent can only DRAFT; a human posts under their own session.

        | Tool | Scope |
        |---|---|
        | list_tax_invoices / get_tax_invoice | sales.tax_invoice.read |
        | create_tax_invoice_draft | sales.tax_invoice.create |
        | list_receipts / get_receipt | sales.receipt.read |
        | create_receipt_draft | sales.receipt.create |
        | list_quotations / get_quotation | sales.quotation.read |
        | create_quotation_draft | sales.quotation.create |
        | list_customers / get_customer | master.customer.read |
        | create_customer | master.customer.manage |
        | list_products / get_product | master.product.read |
        | create_product | master.product.manage |
        | list_purchase_orders / get_purchase_order | purchase.purchase_order.read |
        | create_purchase_order_draft | purchase.purchase_order.create |
        | list_vendor_invoices / get_vendor_invoice | purchase.vendor_invoice.read |
        | create_vendor_invoice_draft | purchase.vendor_invoice.create |
        | list_payment_vouchers / get_payment_voucher | purchase.payment_voucher.read |
        | create_payment_voucher_draft | purchase.payment_voucher.create |
        | list_vendors / get_vendor / create_vendor | master.vendor.manage |
        | list_employees | master.employee.lookup (OR master.employee.manage — back-compat for keys minted before the U6 scope narrowing) |
        | create_manual_journal_draft | gl.journal.create |
        | get_tax_invoice_pdf_url | sales.tax_invoice.read |
        | get_receipt_pdf_url | sales.receipt.read |
        | get_quotation_pdf_url | sales.quotation.read |
        | get_invoice_pdf_url | sales.billing_note.read |
        | get_delivery_order_pdf_url | sales.delivery_order.manage |
        | get_purchase_order_pdf_url | purchase.purchase_order.read |
        | get_payment_voucher_pdf_url | purchase.payment_voucher.read |
        | list_pending_approvals | sales.tax_invoice.read |
        | get_document_status | sales.tax_invoice.read |

        Create-draft tools return `{ id, approvalUrl }`; master-data create tools return `{ id, code, nameTh }`;
        pdf-url tools return `{ id, url }` (Draft → mcp.pdf_not_posted error). The PDF URL points at the
        `/api/v1/{doc}/{id}/pdf` routes above (fetch with `X-Api-Key`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: MCP JSON-RPC 2.0 request envelope. Shape determined by the MCP protocol, not this API.
      responses:
        '200':
          description: MCP JSON-RPC response or SSE stream (content-type varies by transport negotiation).
        '401': { description: 'auth.* (missing/invalid/expired/revoked API key)' }
        '429': { description: 'Rate limit exceeded (per-key 120 req/min)' }

# ============================================================
# COMPONENTS
# ============================================================
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Format: `key_<40-char-random>`. Issued via `POST /api-keys` (admin BFF).
        Plaintext returned once on create/rotate; only bcrypt hash + 16-char prefix stored.
        Scoped per-key (ScopesJson array of permission strings) + optional default_business_unit_id (auto-fill + lock per binding behavior).
        Required on all `/api/v1/*` endpoints (auth isolation: JWT not accepted on v1; ApiKey not accepted on root).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'BFF cookie-based JWT for human users via /auth/login. Required on all root endpoints (auth isolation: ApiKey not accepted on root).'
    OAuth2:
      type: oauth2
      description: 'Reserved for Phase 2 client_credentials flow when first customer demands OAuth. API key sufficient for Phase 1.'
      flows:
        clientCredentials:
          tokenUrl: https://api.your-teas.example/oauth/token
          scopes:
            read: Read access
            write: Write access
            admin: Admin access

  parameters:
    DocId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: UUID v4 to prevent duplicate operations
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (idempotency / state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    # === /api/v1/* error envelope per Sprint 14 P5 + plan §20.7 ===
    ErrorEnvelope401:
      description: 'Authentication failed. Body uses v1 envelope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelopeV1'

  schemas:
    # === CIT Phase C-C (ภ.ง.ด.50 foundations) ===
    Pnd50Preview:
      type: object
      description: >
        ภ.ง.ด.50 dashboard dry-run — same figures the PDF filler prints (single source) plus the
        refusal codes that would 422 the /pdf endpoint. All amounts THB; signed where the form uses
        a sign radio (ladder rows, retained earnings).
      properties:
        year: { type: integer }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        isSme: { type: boolean }
        paidUpCapital: { type: number, nullable: true }
        revenue: { type: number }
        expenses: { type: number }
        pnd51EstimatedProfit: { type: number, nullable: true }
        pnd51Prepaid: { type: number }
        whtCreditTotal: { type: number, description: FY AR-side 50ทวิ credit (box 54) }
        whtCertificates:
          type: array
          items: { $ref: '#/components/schemas/Pnd50WhtCert' }
        ladder:
          oneOf:
            - { $ref: '#/components/schemas/Pnd50Ladder' }
            - { type: 'null' }
          description: null when a refusal prevented building it
        adjustments:
          type: array
          items: { $ref: '#/components/schemas/CitAdjustment' }
        expenseSchedule:
          oneOf:
            - { $ref: '#/components/schemas/Pnd50ExpenseSchedule' }
            - { type: 'null' }
          description: p5 รายการที่ 7 partition; null when a refusal prevented building it
        disallowed:
          oneOf:
            - { $ref: '#/components/schemas/Pnd50Disallowed' }
            - { type: 'null' }
          description: p5 รายการที่ 8 classification; null when a refusal prevented building it
        taxBeforeCredits: { type: number }
        creditsTotal: { type: number }
        netPayable: { type: number, description: absolute value; see payMore for direction }
        payMore: { type: boolean, description: true ชำระเพิ่มเติม, false ชำระไว้เกิน }
        surcharge: { type: number, description: ม.67ตรี under-estimate penalty (0 when none) }
        totalDue: { type: number }
        balanceSheet: { $ref: '#/components/schemas/Pnd50BalanceSheet' }
        refusals:
          type: array
          items: { type: string }
          description: >
            empty when renderable; otherwise any of pnd50.override_breaks_ladder,
            pnd50.ladder_sign_flip, pnd50.surcharge_with_overpaid,
            pnd50.schedule_breaks_ladder, or informational pnd50.disclosure_required
            (warns only — the /pdf endpoint still renders)
    Pnd50ExpenseSchedule:
      type: object
      description: >
        p5 รายการที่ 7 รายจ่ายในการขายและบริหาร (boxes 110-129.1, column ③) — a PARTITION of the
        FY per-account expenses by the TEAS account-code convention (5400-5499 → employee ·
        5100-5199 → rent · 5300-5349 → marketing · 5350-5399 → otherTaxes · 5500-5599 →
        financeCost · 5200-5299 → otherFees · rest → other). total == ladder row 8
        (sellingAdminExpenses).
      properties:
        employee: { type: number }
        directorComp: { type: number }
        utilities: { type: number }
        travel: { type: number }
        freight: { type: number }
        rent: { type: number }
        repairs: { type: number }
        entertainment: { type: number }
        marketing: { type: number }
        sbtTax: { type: number }
        otherTaxes: { type: number }
        financeCost: { type: number, description: 5500-5599 — ร.7 line 12, never p4 ร.6 (flat P&L) }
        bookkeeping: { type: number }
        auditFee: { type: number }
        politicalDonation: { type: number }
        charityDonation: { type: number }
        educationSport: { type: number }
        consulting: { type: number }
        otherFees: { type: number }
        badDebt: { type: number }
        depreciation: { type: number }
        other: { type: number, description: catch-all line 22 for unmapped accounts }
        doubleDeduct: { type: number, description: line 23 — always 0 in C-D }
        total: { type: number, description: line 24 รวม == ladder sellingAdminExpenses }
    Pnd50Disallowed:
      type: object
      description: >
        p5 รายการที่ 8 รายจ่ายที่ไม่ให้ถือเป็นรายจ่ายฯ (boxes 130-134.1) — positive cit_adjustments
        classified by LegalRefCode/Label. total == ladder row 11 (disallowedExpenses).
      properties:
        incomeTax: { type: number }
        entertainment: { type: number }
        badDebt: { type: number }
        provisions: { type: number }
        fromItem7Line23: { type: number, description: always 0 in C-D }
        other: { type: number }
        total: { type: number }
    Pnd50Ladder:
      type: object
