  # ============================================================
  # ACTIVITY — per-document audit trail (Sprint 13j-FE D1/D2, 13j-PURCH BP-09).
  # ONE templated route: 13 docRoute values, each gated by that document's OWN
  # read permission (not the global report.audit_read) — mirrors this yaml's
  # existing /{docRoute}/{id}/mark-printed precedent. synced 2026-08-21.
  # ActivityEndpoints.cs.
  # ============================================================
  /{docRoute}/{id}/activity:
    get:
      summary: Chronological audit trail for one document (audit.activity_log)
      description: |
        docRoute ∈ {quotations, sales-orders, delivery-orders, tax-invoices,
        receipts, credit-notes, debit-notes, billing-notes, purchase-orders,
        vendor-invoices, payment-vouchers, wht-certificates, payroll-runs}.
        Each is gated by that SAME document's own read permission (the exact
        policy its own GET /{docRoute}/{id} route requires) — e.g.
        sales.quotation.read for quotations, purchase.vendor_invoice.read for
        vendor-invoices. credit-notes/debit-notes both live on the single
        /tax-adjustment-notes/{id} resource but get their OWN read-gated
        activity route here (mirrors PrintEndpoints.cs's existing
        credit-notes/debit-notes split). payroll-runs is gated on
        payroll.run.manage (no separate RunRead permission exists).
        Read-only, tenant-scoped. Fixed 2026-08-20 R3 — previously every route
        shared the global report.audit_read, which no ordinary operator role
        holds (403'd sales_staff on their OWN quotation).
      tags: [Activity]
      parameters:
        - name: docRoute
          in: path
          required: true
          schema:
            type: string
            enum: [quotations, sales-orders, delivery-orders, tax-invoices, receipts,
                   credit-notes, debit-notes, billing-notes, purchase-orders,
                   vendor-invoices, payment-vouchers, wht-certificates, payroll-runs]
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
        '403':
          description: Missing the document's own read permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeV1'

  # ============================================================
  # ADMIN — non-VAT AR backfill (R1/C6 WP-2, one-time super-admin op).
  # synced 2026-08-21. AdminBackfillEndpoints.cs.
  # ============================================================
  /admin/nonvat-ar-backfill:
    post:
      summary: Non-VAT AR backfill for invoices issued before WP-1 shipped (super-admin only, irreversible-once-applied)
      description: |
        mode=preview computes without side effects; mode=apply commits.
        Authorization is an explicit IsSuperAdmin claim check, not a
        permission policy — a one-time prod-data operation, not a
        role-grantable feature. AdminBackfillEndpoints.cs:21.
      tags: [Admin]
      parameters:
        - { name: mode, in: query, required: true, schema: { type: string, enum: [preview, apply] } }
      responses:
        '200': { description: OK }
        '400':
          description: mode missing or invalid
          content:
