  # PUBLIC PDF — the ONE anonymous, browser-openable PDF route
  # (spec mcp-expansion.md §A). synced 2026-08-21. PublicPdfEndpoints.cs.
  # ============================================================
  /public/pdf:
    get:
      summary: Anonymous PDF view via a time-limited DataProtection token (never X-Api-Key/JWT)
      description: |
        docType/docId are resolved by PublicPdfTenantMiddleware from the token
        itself (never a query param), so a doctored URL can't be pointed at a
        different document. Supports tax_invoice, receipt, quotation, invoice
        (billing note), delivery_order, purchase_order, payment_voucher.
        Rendered inline (Content-Disposition: inline), never forced-download.
        Rate-limited. PublicPdfEndpoints.cs:21.
      tags: [Public]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/pdf: {}
        '404':
          description: 'Missing/invalid/expired token, or unknown docType — never 401/403 (no signal to a prober)'

# ============================================================
# /api/v1/* — EXTERNAL API (X-Api-Key auth ONLY, JWT rejected here)
# Sprint 14 P3+
# Auth isolation: ApiKey scheme pinned via apiperm:<scope> policy.
# Every POST/PUT/PATCH REQUIRES `Idempotency-Key` header (Sprint 14 P4).
# Error responses use the standard envelope (Sprint 14 P5; v1 only — root keeps RFC 7807).
# ============================================================
  /api/v1/tax-invoices:
    get:
      summary: '[v1] List tax invoices (cursor-paginated; scope sales.tax_invoice.read)'
      tags: [External API v1]
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: businessUnitId, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/ErrorEnvelope401' }
    post:
      summary: '[v1] Create Tax Invoice (microservice integration)'
      tags: [External API v1]
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Same shape as `CreateTaxInvoiceRequest`. If API key has `default_business_unit_id` set:
                - Omit `business_unit_id` → auto-fill from key
                - Specify matching `business_unit_id` → OK
                - Specify different `business_unit_id` → 409 `business_unit.locked_mismatch`
              properties:
                customer_id: { type: integer, format: int64 }
                doc_date: { type: string, format: date }
                business_unit_id: { type: integer, nullable: true, description: 'Optional; subject to key lock' }
                lines:
                  type: array
                  items: { type: object }
      responses:
        '201':
          description: 'Created (or replayed via Idempotency-Key match — see `Idempotency-Replayed: true` header)'
        '400': { description: 'Validation error or idempotency.required (missing Idempotency-Key header on mutation)' }
        '401': { description: 'auth.* (missing/invalid/expired/revoked API key)' }
        '403': { description: 'auth.scope_required (key lacks sales.tax_invoice.create scope)' }
        '409':
          description: |
            One of:
            - `idempotency.body_mismatch` — same Idempotency-Key with different body within 24h TTL
            - `business_unit.locked_mismatch` — request BU differs from key's default_business_unit_id
            - `business_unit.cross_bu_not_allowed_for_this_key` — receipt apply spans multiple BUs (API key callers locked to single-BU)

