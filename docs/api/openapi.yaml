openapi: 3.0.3
info:
  title: Thailand Enterprise Accounting System API
  description: |
    REST API สำหรับระบบบัญชี enterprise ของไทย

    **Authentication:** API Key + HMAC signature, OR OAuth2 client_credentials
    **Idempotency:** ทุก POST/PUT ต้องมี Idempotency-Key header (UUID v4)
    **Rate limit:** 1,000 req/min per API key (default)
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@example.com

servers:
  # Host root only — paths carry their own prefix. BFF/JWT routes are bare
  # (e.g. /quotations); the external API key surface is under /api/v1/*; MCP at /mcp.
  - url: https://api.accounting.example.com
    description: Production
  - url: https://api-staging.accounting.example.com
    description: Staging

security:
  - ApiKeyAuth: []
  - OAuth2: [read, write]

paths:
  # ============================================================
  # QUOTATIONS
  # ============================================================
  /quotations:
    post:
      summary: สร้างใบเสนอราคา (Draft)
      tags: [Quotations]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      summary: ค้นหา/list ใบเสนอราคา
      tags: [Quotations]
      parameters:
        - name: customer_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, SENT, ACCEPTED, REJECTED, EXPIRED, CANCELLED]
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationList'

  /quotations/{id}:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: ดูใบเสนอราคา
      tags: [Quotations]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: แก้ไขใบเสนอราคา (Draft only)
      tags: [Quotations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
    delete:
      summary: ลบใบเสนอราคา (Draft only)
      tags: [Quotations]
      responses:
        '204':
          description: Deleted

  /quotations/{id}/create-tax-invoice:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: สร้างใบกำกับภาษีตรงจากใบเสนอราคา (non-VAT-chain shortcut; ม.86)
      tags: [Quotations]
      responses:
        '200':
          description: 'TI draft created — returns { tax_invoice_id }'

  /quotations/{id}/send:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: ส่งใบเสนอราคาให้ลูกค้า (mark Sent)
      tags: [Quotations]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'

  /quotations/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Mark ใบเสนอราคาว่า accepted (สามารถ convert เป็น SO)
      tags: [Quotations]
      responses:
        '200':
          description: OK

  /quotations/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Mark ใบเสนอราคาว่า rejected (พร้อมเหตุผล)
      tags: [Quotations]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK

  /quotations/{id}/convert-to-so:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: แปลงใบเสนอราคา (accepted) เป็น Sales Order
      tags: [Quotations]
      responses:
        '200':
          description: 'SO created — returns { sales_order_id }'

  /quotations/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: ยกเลิกใบเสนอราคา
      tags: [Quotations]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK

  /quotations/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Download PDF
      tags: [Quotations]
      responses:
        '200':
          description: OK
          content:
            application/pdf: {}

  /quotations/{id}/paper:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Canonical paper JSON (?copy=true สำเนา)
      description: Returns the same canonical PaperDoc model the PDF renders (screen == print parity).
      tags: [Quotations]
      parameters:
        - { name: copy, in: query, schema: { type: boolean }, description: 'true = สำเนา (copy) watermark variant' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDoc'
        '401': { description: Unauthorized }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # SALES ORDERS
  # ============================================================
  /sales-orders:
    post:
      summary: สร้าง Sales Order
      tags: [Sales Orders]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
    get:
      summary: รายการ Sales Orders
      tags: [Sales Orders]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK

  /sales-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: ดู Sales Order
      tags: [Sales Orders]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: แก้ไข Sales Order (Draft only)
      tags: [Sales Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderCreateRequest'
      responses:
        '200':
          description: OK

  /sales-orders/{id}/delivery-orders/full:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: สร้าง Delivery Order เต็มจำนวน (ทุกบรรทัดคงเหลือ) จาก Sales Order
      description: 'combineTi (query, optional) — สร้างใบกำกับภาษีต่อทันทีในคำขอเดียวกัน'
      tags: [Sales Orders]
      parameters:
        - { name: combineTi, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: 'DO created (+ TI if combineTi=true)'

  /sales-orders/{id}/create-invoice:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: สร้างเอกสารถัดไปตรงจาก Sales Order — VAT mode สร้างใบกำกับภาษี, non-VAT สร้างใบแจ้งหนี้
      description: |
        Company VAT mode decides the target doc type (checked dynamically —
        sales.tax_invoice.create for VAT mode, sales.billing_note.manage for
        non-VAT). Response always carries both keys; the inactive one is null.
      tags: [Sales Orders]
      responses:
        '200':
          description: 'One of tax_invoice_id / billing_note_id populated, the other null'

  /sales-orders/{id}/post:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: ยืนยัน/Post Sales Order (was confirm; now post)
      tags: [Sales Orders]
      responses:
        '200':
          description: OK

  /sales-orders/{id}/delivery-orders:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: สร้าง Delivery Order จาก Sales Order
      tags: [Sales Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryOrderCreateRequest'
      responses:
        '200':
          description: 'DO created — returns { delivery_order_id }'

  /sales-orders/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Download SO PDF (?copy=true สำเนา)
      tags: [Sales Orders]
      parameters:
        - { name: copy, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf: {}

  /sales-orders/{id}/paper:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Canonical paper JSON (?copy=true สำเนา)
      description: Returns the same canonical PaperDoc model the PDF renders (screen == print parity).
      tags: [Sales Orders]
      parameters:
        - { name: copy, in: query, schema: { type: boolean }, description: 'true = สำเนา (copy) watermark variant' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDoc'
        '401': { description: Unauthorized }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # DELIVERY ORDERS
  # ============================================================
  /delivery-orders:
    post:
      summary: สร้าง Delivery Order
      tags: [Delivery Orders]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryOrderCreateRequest'
      responses:
        '201':
          description: Created
    get:
      summary: รายการ Delivery Orders
      tags: [Delivery Orders]
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK

  /delivery-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: ดู Delivery Order
      tags: [Delivery Orders]
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /delivery-orders/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Issue DO (Draft → Issued; 4-state machine, no stock impact)
      tags: [Delivery Orders]
      responses:
        '200':
          description: OK

  /delivery-orders/{id}/mark-delivered:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Mark DO delivered (Issued → Delivered)
      tags: [Delivery Orders]
      responses:
        '200':
          description: OK

  /delivery-orders/{id}/create-ti:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: สร้างใบกำกับภาษีจาก Delivery Order (VAT-registered เท่านั้น — ม.86)
      tags: [Delivery Orders]
      responses:
        '200':
          description: 'TI draft created — returns { tax_invoice_id }'

  /delivery-orders/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Download DO PDF (?copy=true สำเนา; combined DO+TI ใช้ dual label)
      tags: [Delivery Orders]
      parameters:
        - { name: copy, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf: {}

  /delivery-orders/{id}/paper:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Canonical paper JSON (?copy=true สำเนา)
      description: Returns the same canonical PaperDoc model the PDF renders (screen == print parity).
      tags: [Delivery Orders]
      parameters:
        - { name: copy, in: query, schema: { type: boolean }, description: 'true = สำเนา (copy) watermark variant' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDoc'
        '401': { description: Unauthorized }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # TAX INVOICES ★ (e-Tax compliant)
  # ============================================================
  /tax-invoices:
    get:
      summary: List ใบกำกับภาษี (cursor-paginated, newest first)
      tags: [Tax Invoices]
      description: |
        Cursor-paginated list, sorted by `taxInvoiceId` descending (recent first).
        Pass the previous response's `nextCursor` to fetch the next page.
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: customerId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum: [Draft, Posted]
        - name: search
          in: query
          description: |
            Free-text filter; matches `doc_no` OR `customer_name` (ILIKE,
            case-insensitive substring). Added Sprint 13e P3 for the shared
            TaxInvoicePicker UX — `?search=05-2026-TI` and `?search=Acme` both
            work. Empty/whitespace = no filter.
          schema: { type: string }
        - name: unpaid
          in: query
          description: |
            When `true`, restrict to Tax Invoices with `amount_paid <
            total_amount` (still-has-balance — i.e. eligible to be referenced
            by a new Receipt). Default `false` = no filter. Added Sprint 13e
            P3.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: 'Pass `nextCursor` from previous response. Omit for first page.'
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxInvoiceListResponse'
    post:
      summary: สร้างใบกำกับภาษี (Draft)
      tags: [Tax Invoices]
      description: |
        Creates a Draft Tax Invoice. To finalize and send e-Tax, call POST /tax-invoices/{id}/post.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxInvoiceCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxInvoice'

  /tax-invoices/{id}/post:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Post + sign XML + email customer + cc RD (IRREVERSIBLE)
      tags: [Tax Invoices]
      description: |
        Posts the Tax Invoice. This action:
        1. Assigns next document number
        2. Signs XML with company CA certificate (XAdES-BES)
        3. Generates PDF/A-3 with embedded signed XML
        4. Sends email to customer + cc csemail@rd.go.th
        5. Marks status = POSTED (immutable)

        **After posting, any correction must use Credit Note.**
      responses:
        '200':
          description: Posted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Already posted or invalid state

  /tax-invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: ดูใบกำกับภาษี
      tags: [Tax Invoices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxInvoice'

  /tax-invoices/{id}/xml:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Download signed XML
      tags: [Tax Invoices]
      responses:
        '200':
          description: OK
          content:
            application/xml: {}

  /tax-invoices/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Download PDF/A-3 (with embedded XML)
      tags: [Tax Invoices]
      responses:
        '200':
          description: OK
          content:
            application/pdf: {}

  /tax-invoices/{id}/paper:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Canonical paper JSON (?copy=true สำเนา)
      description: Returns the same canonical PaperDoc model the PDF renders (screen == print parity).
      tags: [Tax Invoices]
      parameters:
        - { name: copy, in: query, schema: { type: boolean }, description: 'true = สำเนา (copy) watermark variant' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDoc'
        '401': { description: Unauthorized }
        '404': { $ref: '#/components/responses/NotFound' }

  # /tax-invoices/{id}/etax-status FIXED 2026-08-21 — stale path, no such route
  # in TaxInvoiceEndpoints.cs. The real e-Tax submission-audit query is:
  /etax/submissions:
    get:
      summary: e-Tax submission audit history for one tax invoice
      description: |
        Read-only submission-audit query (Sprint 13c). Reuses tax.filing.read —
        e-Tax is tax-domain and no dedicated e-Tax permission is seeded. Never
        projects storage_path. EtaxEndpoints.cs:19.
      tags: [Tax Invoices]
      parameters:
        - name: tax_invoice_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EtaxStatus'

  /tax-invoices/{id}/resend:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: ส่ง email ลูกค้าใหม่ (ไม่ส่ง RD ซ้ำ)
      tags: [Tax Invoices]
      responses:
        '200':
          description: OK

  # ============================================================
  # CREDIT / DEBIT NOTES ★ — actual route /tax-adjustment-notes
  # (one resource, noteType CN|DN discriminator; the old documented
  #  /credit-notes + /debit-notes paths never existed — fixed 2026-06-12)
  # ============================================================
  /tax-adjustment-notes:
    post:
      summary: สร้างใบลดหนี้/ใบเพิ่มหนี้ draft (อ้างอิง Tax Invoice เดิม — ม.86/10 · ม.86/9)
      tags: [Credit/Debit Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxAdjustmentNoteRequest'
      responses:
        '201': { description: 'Created (Draft) — `{ note_id }`' }
    get:
      summary: รายการ CN/DN (cursor pagination, filter noteType/businessUnitId)
      tags: [Credit/Debit Notes]
      parameters:
        - { name: noteType, in: query, schema: { type: string, enum: [Credit, Debit] }, description: 'Parsed via Enum.TryParse (ignoreCase); null = both' }
        - { name: cursor, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
        - { name: businessUnitId, in: query, schema: { type: integer } }
        - { name: includeUnspecified, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK }

  /tax-adjustment-notes/{id}:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: รายละเอียด CN/DN
      tags: [Credit/Debit Notes]
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    delete:
      summary: ลบ CN/DN (Draft only)
      tags: [Credit/Debit Notes]
      responses:
        '204': { description: Deleted }

  /tax-adjustment-notes/{id}/post:
    parameters:
      - $ref: '#/components/parameters/DocId'
    post:
      summary: Post (ออกเลขเอกสาร + GL + e-Tax + email)
      tags: [Credit/Debit Notes]
      responses:
        '200': { description: 'Posted — `{ noteId, docNo, postedAt, noteType, totalAmount, taxAmount }`' }

  /tax-adjustment-notes/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Download CN/DN PDF (?copy=true สำเนา)
      tags: [Credit/Debit Notes]
      parameters:
        - { name: copy, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: PDF stream
          content:
            application/pdf: {}

  /tax-adjustment-notes/{id}/paper:
    parameters:
      - $ref: '#/components/parameters/DocId'
    get:
      summary: Canonical paper JSON (?copy=true สำเนา)
      description: Returns the same canonical PaperDoc model the PDF renders (screen == print parity).
      tags: [Credit/Debit Notes]
      parameters:
        - { name: copy, in: query, schema: { type: boolean }, description: 'true = สำเนา (copy) watermark variant' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDoc'
        '401': { description: Unauthorized }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # RECEIPTS (ใบเสร็จรับเงิน) — actual route /receipts (was /customer-receipts)
  # ============================================================
  /receipts:
    post:
      summary: สร้างใบเสร็จรับเงิน (Draft)
      description: |
        Apply-mode (VAT path): `applications[]` — exactly ONE of
        `taxInvoiceId` / `deliveryOrderId` / `billingNoteId` per application.
        Standalone mode (non-VAT cash bill): empty `applications` + own `lines[]`.
        WHT the customer withheld: `whtLines[]` (preferred, multi income-type)
        or legacy single `whtAmount`+`whtTypeId`.
      tags: [Receipts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceiptRequest'
      responses:
        '201': { description: Created (Draft — doc number assigned on post) }
    get:
      summary: รายการใบเสร็จ (cursor pagination)
      tags: [Receipts]
      responses:
        '200': { description: OK }

