  # (content-type was even wrong: application/xml — the real batch file is
  # pipe-delimited text/plain, see GET /tax-filings/pnd30/batch-file above).

  # ============================================================
  # ADMIN / SYSTEM
  # ============================================================
  /system/info:
    get:
      summary: System info (vat_mode, version, etc.) — per-company since 2026-06-11
      description: >
        Authenticated (per-company-vat-mode spec §4.6): vat_mode / vat_rate /
        pnd30_submission_mode are read from the caller company's row on
        master.companies, no longer from instance env config.
      tags: [System]
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'

  /system/vat-threshold-status:
    get:
      summary: VAT-registration threshold status (ม.85/1) — any signed-in user
      description: Sprint 8.5. Authenticated (needs tenant context for the TI query); no specific permission. Program.cs:552.
      tags: [System]
      responses:
        '200':
          description: 'returns { status }'

  /system/setup/status:
    get:
      summary: First-run probe (anonymous) — needs_setup=true when the instance has ZERO users
      description: >
        Anonymous. Drives the login page's first-run routing: when needs_setup is true (a fresh
        install with no user yet) the frontend sends the visitor to the /onboarding wizard instead
        of /login. Leaks only a single boolean — no data, no user info. Same zero-users invariant the
        POST /system/setup/bootstrap-admin gate enforces.
      tags: [System]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  needs_setup: { type: boolean }

  /system/setup/bootstrap-admin:
    post:
      summary: First-run super-admin bootstrap (anonymous — SECURITY-CRITICAL)
      description: |
        Succeeds ONLY when the system has ZERO users total (TOCTOU-safe via a
        Postgres advisory lock in one transaction) — the instant any user
        exists this refuses with 409. That single invariant is what makes an
        anonymous create-admin endpoint safe. Created user is a global
        super-admin with NO user_roles row (companyId=0 → FE routes to
        /onboarding to create the first company). BootstrapAdminEndpoints.cs:40.
      tags: [System]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 12 }
                email: { type: string }
                fullName: { type: string }
      responses:
        '200':
          description: 'Created — returns { ok, userId, username }'
        '400':
          description: validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeV1'
        '409':
          description: already_initialised — at least one user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeV1'

  /system/setup/instance-keys:
    post:
      summary: First-run instance MFA key + JWT access-token lifetime (security-critical)
      description: |
        Sets the instance MFA AES-256 key + JWT lifetime, written to a
        git-ignored secrets file (never logged, never committed). The MFA key
        is refuse-to-overwrite once set (rotating would orphan every enrolled
        user's TOTP secret) — this is what "first-run only" means for it.
        Authenticated + explicit super-admin claim check (a fresh super-admin
        carries no permission claims yet, so a permission-policy gate would
        wrongly 403). InstanceSetupEndpoints.cs:54.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaAesKeyBase64, jwtAccessTokenMinutes]
              properties:
                mfaAesKeyBase64: { type: string, description: 'base64, must decode to exactly 32 bytes' }
                jwtAccessTokenMinutes: { type: integer, minimum: 5, maximum: 1440 }
      responses:
        '200':
