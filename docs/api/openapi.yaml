    CreateReceiptRequest:
      type: object
      description: 'Shipped contract of POST /receipts (camelCase JSON; replaces the stale CustomerReceiptCreateRequest).'
      required: [docDate, customerId, paymentMethod, currencyCode, exchangeRate, applications]
      properties:
        docDate: { type: string, format: date, description: 'Server enforces today (Asia/Bangkok)' }
        customerId: { type: integer, format: int64 }
        paymentMethod: { type: string, enum: [Cash, Transfer, Cheque, CreditCard, Other] }
        chequeNo: { type: string, nullable: true }
        chequeDate: { type: string, format: date, nullable: true }
        bankAccountId: { type: integer, format: int64, nullable: true }
        currencyCode: { type: string, example: THB }
        exchangeRate: { type: number, example: 1 }
        notes: { type: string, nullable: true }
        businessUnitId: { type: integer, nullable: true }
        applications:
          type: array
          description: 'Apply-mode: exactly ONE of taxInvoiceId / deliveryOrderId / billingNoteId per item. Empty array = standalone non-VAT receipt (use lines).'
          items:
            type: object
            required: [appliedAmount]
            properties:
              taxInvoiceId: { type: integer, format: int64, nullable: true }
              deliveryOrderId: { type: integer, format: int64, nullable: true }
              billingNoteId: { type: integer, format: int64, nullable: true }
              appliedAmount: { type: number }
        whtAmount: { type: number, default: 0, description: 'LEGACY single-category WHT (use whtLines instead)' }
        whtTypeId: { type: integer, nullable: true }
        customerWhtCertNo: { type: string, nullable: true }
        customerWhtCertDate: { type: string, format: date, nullable: true }
        whtLines:
          type: array
          description: 'Preferred multi-income-type WHT the customer withheld; rate/amount computed server-side.'
          items:
            type: object
            required: [whtTypeId, baseAmount]
            properties:
              whtTypeId: { type: integer }
              baseAmount: { type: number }
        lines:
          type: array
          description: 'Non-VAT standalone receipt lines (cash bill) — only when applications is empty. No VAT field (ม.86).'
          items:
            type: object
            required: [descriptionTh, quantity, unitPrice, amount]
            properties:
              descriptionTh: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }
              amount: { type: number }
              productId: { type: integer, format: int64, nullable: true }
              productCode: { type: string, nullable: true }
              productType: { type: string, default: GOOD }
              uomText: { type: string, nullable: true }

    # === Billing Note (ใบแจ้งหนี้) — shipped contract (camelCase JSON) ===
    BillingLineInput:
      type: object
      description: 'BN line (BillingLineInput record). camelCase JSON.'
      required: [descriptionTh, quantity, uomText, unitPrice, discountPercent, taxCodeId, taxCode, taxRate]
      properties:
        productId: { type: integer, format: int64, nullable: true }
        taxInvoiceId: { type: integer, format: int64, nullable: true, description: 'Optional source TI for this rolled-up line' }
        descriptionTh: { type: string }
        quantity: { type: number }
        uomText: { type: string }
        unitPrice: { type: number }
        discountPercent: { type: number }
        taxCodeId: { type: integer }
        taxCode: { type: string, example: VAT-OUT-7 }
        taxRate: { type: number, description: 'Decimal fraction (0.07 = 7%)' }
        productType: { type: string, nullable: true }

    CreateBillingNoteRequest:
      type: object
      description: 'Shipped contract of POST/PUT /billing-notes (CreateBillingNoteRequest record; camelCase JSON).'
      required: [docDate, dueDate, customerId, currencyCode, exchangeRate, lines]
      properties:
        docDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        customerId: { type: integer, format: int64 }
        businessUnitId: { type: integer, nullable: true }
        quotationId: { type: integer, format: int64, nullable: true }
        taxInvoiceIds:
          type: array
          nullable: true
          description: 'A BN may group N posted TIs for the same customer'
          items: { type: integer, format: int64 }
        currencyCode: { type: string, example: THB }
        exchangeRate: { type: number, example: 1 }
        notes: { type: string, nullable: true }
        internalNotes: { type: string, nullable: true }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillingLineInput'

    # === Vendor Invoice — Sprint 5.5/6 shipped contract (camelCase JSON) ===
    CreateVendorInvoiceRequest:
      type: object
      description: 'Shipped contract of POST /vendor-invoices (CreateVendorInvoiceRequest record; camelCase JSON).'
      required: [docDate, vendorId, vendorTaxInvoiceNo, vendorTaxInvoiceDate,
                 currencyCode, exchangeRate, lines]
      properties:
        docDate: { type: string, format: date, description: 'Our recording date (Asia/Bangkok today)' }
        vendorId: { type: integer, format: int64 }
        vendorTaxInvoiceNo: { type: string, maxLength: 50, description: "Vendor's ใบกำกับภาษีซื้อ no. (snapshot)" }
        vendorTaxInvoiceDate: { type: string, format: date, description: "Vendor's TI date — anchors the ม.82/4 window" }
        vatClaimPeriod:
          type: integer
          nullable: true
          description: |
            yyyymm. Must fall within [TI_month .. TI_month+6]. Null → default to period
            of vendorTaxInvoiceDate. Target period must be open.
          example: 202604
        currencyCode: { type: string, minLength: 3, maxLength: 3, default: THB }
        exchangeRate: { type: number, exclusiveMinimum: 0, default: 1 }
        notes: { type: string, nullable: true }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [expenseCategoryId, description, amount, vatRate]
            properties:
              expenseCategoryId: { type: integer, description: 'Drives is_recoverable_vat/is_capex/is_cogs snapshot' }
              expenseAccountId:
                type: integer
                format: int64
                nullable: true
                description: 'Null → resolve from category default at draft create'
              description: { type: string, maxLength: 500 }
              amount: { type: number, exclusiveMinimum: 0, description: 'Net, ex-VAT' }
              vatRate: { type: number, minimum: 0, maximum: 1, description: 'Decimal fraction: 0.07 = 7%, 0 = zero-rate' }
              productType: { type: string, nullable: true, description: 'สินค้า/บริการ snapshot (UPPER_SNAKE); null → GOOD' }
        hasInputVat: { type: boolean, nullable: true, description: 'Null = auto-derive (foreign-no-VAT-D / non-VAT vendor → false)' }
        purchaseOrderId: { type: integer, format: int64, nullable: true, description: 'Optional retroactive PO link' }
        businessUnitId: { type: integer, nullable: true, description: 'Required when Company.RequiresBusinessUnit; embedded in VI doc number at POST' }

    VendorInvoicePostedResult:
      type: object
      properties:
        vendor_invoice_id: { type: integer, format: int64 }
        doc_no: { type: string, description: 'VI-NNNN format, allocated on POST' }
        posted_at: { type: string, format: date-time }
        total_amount: { type: number }
        vat_amount: { type: number }
        vat_claim_period: { type: integer, description: 'yyyymm — appears in tax.input_vat_register for this period' }

    VendorInvoiceListItem:
      type: object
      properties:
        vendor_invoice_id: { type: integer, format: int64 }
        doc_no: { type: string, nullable: true, description: 'Null while Draft, allocated on Post' }
        doc_date: { type: string, format: date }
        vendor_name: { type: string }
        vendor_tax_id: { type: string, nullable: true }
        vendor_tax_invoice_no: { type: string }
        vat_claim_period: { type: integer }
        total_amount: { type: number }
        vat_amount: { type: number }
        settled_amount: { type: number }
        settlement_status: { type: string, enum: [UNPAID, PARTIAL, PAID] }
        status: { type: string, enum: [Draft, Posted, Voided] }
        currency_code: { type: string }

    VendorInvoiceLineView:
      type: object
      properties:
        line_no: { type: integer }
        expense_category_id: { type: integer }
        expense_account_id: { type: integer, format: int64 }
        description: { type: string }
        amount: { type: number }
        vat_rate: { type: number }
        vat_amount: { type: number }
        is_recoverable_vat: { type: boolean, description: 'Snapshot at draft. Non-rec (ENT/VEHI per ม.82/5) lumps VAT into expense.' }
        is_capex: { type: boolean }
        is_cogs: { type: boolean }

    VendorInvoiceDetail:
      type: object
      properties:
        vendor_invoice_id: { type: integer, format: int64 }
        doc_no: { type: string, nullable: true }
        status: { type: string, enum: [Draft, Posted, Voided] }
        doc_date: { type: string, format: date }
        vendor_tax_invoice_no: { type: string }
        vendor_tax_invoice_date: { type: string, format: date }
        vat_claim_period: { type: integer }
        vendor_id: { type: integer, format: int64 }
        vendor_name: { type: string }
        vendor_tax_id: { type: string, nullable: true }
        vendor_branch_code: { type: string, nullable: true }
        vendor_address: { type: string, nullable: true }
        currency_code: { type: string }
        exchange_rate: { type: number }
        subtotal_amount: { type: number }
        vat_amount: { type: number }
        non_recoverable_vat_amount: { type: number }
        total_amount: { type: number }
        settled_amount: { type: number }
        settlement_status: { type: string, enum: [UNPAID, PARTIAL, PAID] }
        notes: { type: string, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/VendorInvoiceLineView' }

    # === Payment Voucher — Sprint 5/6 shipped contract (camelCase JSON) ===
    CreatePaymentVoucherRequest:
      type: object
      description: 'Shipped contract of POST /payment-vouchers (CreatePaymentVoucherRequest record; camelCase JSON).'
      required: [docDate, vendorId, expenseCategoryId, paymentMethod,
                 currencyCode, exchangeRate, lines]
      properties:
        docDate: { type: string, format: date }
        vendorId: { type: integer, format: int64 }
        expenseCategoryId: { type: integer, description: 'Header-level — drives PV sub-prefix (e.g. PV-RENT-NNNN)' }
        paymentMethod:
          type: string
          enum: [Cash, Transfer, Cheque, CreditCard, Other]
          description: 'PaymentMethod enum, serialized as string (JsonStringEnumConverter, runtime-gotchas §3)'
        chequeNo: { type: string, nullable: true, description: 'Required when paymentMethod=Cheque' }
        chequeDate: { type: string, format: date, nullable: true, description: 'Required when paymentMethod=Cheque' }
        bankAccountId: { type: integer, format: int64, nullable: true }
        currencyCode: { type: string, minLength: 3, maxLength: 3, default: THB }
        exchangeRate: { type: number, exclusiveMinimum: 0, default: 1 }
        description: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        vendorInvoiceId:
          type: integer
          format: int64
          nullable: true
          description: 'Set → PV settles a posted VI (GL: Dr AP). Null → standalone PV (GL: Dr Expense).'
        selfWithholdMode:
          type: boolean
          nullable: true
          description: 'Sprint 8.7 — null = auto (foreign vendor without Thai VAT-D → true). true → vendor paid in full, WHT remitted by us.'
        businessUnitId: { type: integer, nullable: true, description: 'Required when Company.RequiresBusinessUnit; embedded in PV doc number at POST' }
        whtPayerMode:
          type: string
          nullable: true
          enum: [DEDUCT, GROSS_UP_FOREVER, GROSS_UP_ONCE]
          description: '2026-06-12 wht-grossup — เงื่อนไข 50ทวิ. null → derived (self-withhold ⇒ GROSS_UP_FOREVER, the RD-safe default; else DEDUCT). Gross-up: the absorbed tax counts as the payee''s income (FOREVER: base = net/(1−r) · ONCE: base = net·(1+r)); cert income/tax and GL use the grossed figures. Detail responses echo whtPayerMode; WHT certificates carry whtCondition 1|2|3.'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, amount, vatRate, isRecoverableVat, whtRate]
            properties:
              expenseAccountId:
                type: integer
                format: int64
                nullable: true
                description: 'Null → resolve from PV expense-category default'
              description: { type: string, maxLength: 500 }
              amount: { type: number, exclusiveMinimum: 0 }
              taxCodeId: { type: integer, nullable: true }
              vatRate: { type: number, minimum: 0, maximum: 1, description: 'Decimal fraction (0.07 = 7%)' }
              isRecoverableVat: { type: boolean }
              whtTypeId: { type: integer, nullable: true }
              whtRate: { type: number, minimum: 0, maximum: 1, description: 'Decimal fraction; WHT base = net of VAT per ม.50ทวิ' }
              productType: { type: string, nullable: true, description: 'สินค้า/บริการ snapshot (UPPER_SNAKE); null → GOOD' }

    PaymentVoucherApprovedResult:
      type: object
      properties:
        payment_voucher_id: { type: integer, format: int64 }
        approved_by: { type: integer, format: int64 }
        approved_at: { type: string, format: date-time }

    PaymentVoucherPostedResult:
      type: object
      properties:
        payment_voucher_id: { type: integer, format: int64 }
        doc_no: { type: string, description: 'PV-{SubPrefix}-NNNN (e.g. PV-RENT-0001)' }
        posted_at: { type: string, format: date-time }
        total_paid: { type: number, description: 'Cash actually disbursed (gross - WHT)' }
        vat_amount: { type: number }
        wht_amount: { type: number }
        wht_certificate_id: { type: integer, format: int64, nullable: true }
        wht_cert_no: { type: string, nullable: true, description: 'WHT-NNNN when WHT > 0' }

    PaymentVoucherListItem:
      type: object
      properties:
        payment_voucher_id: { type: integer, format: int64 }
        doc_no: { type: string, nullable: true }
        doc_date: { type: string, format: date }
        vendor_name: { type: string }
        expense_category_code: { type: string }
        payment_method: { type: string, enum: [Cash, Transfer, Cheque, Credit] }
        total_paid: { type: number }
        wht_amount: { type: number }
        status: { type: string, enum: [Draft, Approved, Posted, Voided] }
        vendor_invoice_id: { type: integer, format: int64, nullable: true, description: 'Non-null → this PV settles a VI' }
        currency_code: { type: string }

    PaymentVoucherDetail:
      type: object
      properties:
        payment_voucher_id: { type: integer, format: int64 }
        doc_no: { type: string, nullable: true }
        status: { type: string, enum: [Draft, Approved, Posted, Voided] }
        doc_date: { type: string, format: date }
        vendor_id: { type: integer, format: int64 }
        vendor_name: { type: string }
        expense_category_id: { type: integer }
        payment_method: { type: string, enum: [Cash, Transfer, Cheque, Credit] }
        cheque_no: { type: string, nullable: true }
        cheque_date: { type: string, format: date, nullable: true }
        bank_account_id: { type: integer, format: int64, nullable: true }
        currency_code: { type: string }
        exchange_rate: { type: number }
        subtotal_amount: { type: number }
        vat_amount: { type: number }
        wht_amount: { type: number }
        total_paid: { type: number }
        description: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        vendor_invoice_id: { type: integer, format: int64, nullable: true }
        approved_by: { type: integer, format: int64, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        posted_at: { type: string, format: date-time, nullable: true }
        wht_certificate_id: { type: integer, format: int64, nullable: true }

    # === Master Data ===
    CustomerCreateRequest:
      type: object
      required: [customer_code, name_th, customer_type]
      properties:
        customer_code: { type: string }
        customer_type:
          type: string
          enum: [INDIVIDUAL, CORPORATE]
        tax_id: { type: string, nullable: true }
        branch_code: { type: string, nullable: true }
        name_th: { type: string }
        name_en: { type: string, nullable: true }
        vat_registered: { type: boolean, default: false }
        billing_address: { type: string }
        contact_person: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        credit_limit: { type: number, default: 0 }
        payment_term_days: { type: integer, default: 0 }

    ProductCreateRequest:
      type: object
      required: [product_code, name_th, product_type, base_uom_id]
      properties:
        product_code: { type: string, description: SKU code }
        name_th: { type: string }
        name_en: { type: string, nullable: true }
        product_type:
          type: string
          enum: [GOOD, SERVICE]
        base_uom_id: { type: integer }
        list_price: { type: number, default: 0 }
        default_output_tax_code: { type: string }
        default_input_tax_code: { type: string }

    ExpenseCategory:
      type: object
      properties:
        category_id: { type: integer }
        category_code: { type: string, example: RENT }
        name_th: { type: string }
        name_en: { type: string }
        is_capex: { type: boolean }
        is_cogs: { type: boolean }
        default_expense_account_id: { type: integer, nullable: true }
        default_tax_code_id: { type: integer, nullable: true }
        default_wht_type_id: { type: integer, nullable: true }

    SystemInfo:
      type: object
      description: 'vat_mode/vat_rate/pnd30_submission_mode are the CALLER COMPANY''s values (per-company-vat-mode spec, 2026-06-11).'
      properties:
        version: { type: string }
        vat_mode: { type: boolean }
        vat_rate: { type: number }
        pnd30_submission_mode:
          type: string
          enum: [auto, manual]
        document_number_format: { type: string, example: MM-YYYY-PREFIX-NNNN }
        timezone: { type: string, example: Asia/Bangkok }

    Company:
      type: object
      properties:
        companyId: { type: integer }
        taxId: { type: string, description: '13-digit Thai Tax ID' }
        nameTh: { type: string }
        nameEn: { type: string, nullable: true }
        legalEntityType: { type: string }
        vatRegistered: { type: boolean, description: 'Per-company VAT mode (§4.6)' }
        baseCurrency: { type: string, example: THB }
        isActive: { type: boolean }
        paidUpCapital: { type: number, nullable: true }
        vatRate: { type: number, example: 0.07, description: 'Per-company standard VAT rate' }
        pnd30SubmissionMode: { type: string, enum: [manual, auto] }

    CompanyDetail:
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          properties:
            registrationDate: { type: string, format: date, nullable: true }
            vatRegisterDate: { type: string, format: date, nullable: true }
            fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
            addressTh: { type: string, nullable: true }
            subDistrict: { type: string, nullable: true }
            district: { type: string, nullable: true }
            province: { type: string, nullable: true }
            postalCode: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }

    CreateCompanyRequest:
      type: object
      # province + postalCode are required: they form the new company's FOUNDING registered
      # address (ม.86/4), written once into company_profile so every RD form renders an address.
      required: [taxId, nameTh, legalEntityType, vatRegistered, fiscalYearStartMonth, province, postalCode]
      properties:
        taxId: { type: string }
        nameTh: { type: string }
        nameEn: { type: string, nullable: true }
        legalEntityType: { type: string }
        registrationDate: { type: string, format: date, nullable: true }
        vatRegistered: { type: boolean }
        vatRegisterDate: { type: string, format: date, nullable: true }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        addressTh: { type: string, nullable: true }
        subDistrict: { type: string, nullable: true, description: ตำบล/แขวง — also written to company_profile.RegisteredSubdistrict }
        district: { type: string, nullable: true, description: อำเภอ/เขต — also written to company_profile.RegisteredDistrict }
        province: { type: string, description: จังหวัด (required, founding registered address) }
        postalCode: { type: string, pattern: '^\d{5}$', description: รหัสไปรษณีย์ 5 หลัก (required, founding registered address) }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        paidUpCapital: { type: number, nullable: true }
        vatRate: { type: number, minimum: 0, maximum: 1, default: 0.07 }
        pnd30SubmissionMode: { type: string, enum: [manual, auto], default: manual }
        # Granular founding registered-address parts (ม.86/4) — additive & optional, written into
        # company_profile.Reg* and composed into RegisteredAddressLine1 / AddressTh.
        regHouseNo: { type: string, nullable: true, description: เลขที่ }
        regMoo: { type: string, nullable: true, description: หมู่ที่ }
        regSoi: { type: string, nullable: true, description: ตรอก/ซอย }
        regStreet: { type: string, nullable: true, description: ถนน }
        regBuilding: { type: string, nullable: true, description: อาคาร }
        regRoomNo: { type: string, nullable: true, description: ห้องเลขที่ }
        regFloor: { type: string, nullable: true, description: ชั้นที่ }
        regVillage: { type: string, nullable: true, description: หมู่บ้าน }

    UpdateCompanyRequest:
      type: object
      required: [nameTh, vatRegistered, isActive]
      properties:
        nameTh: { type: string }
        nameEn: { type: string, nullable: true }
        vatRegistered: { type: boolean }
        vatRegisterDate: { type: string, format: date, nullable: true }
        addressTh: { type: string, nullable: true }
        subDistrict: { type: string, nullable: true }
        district: { type: string, nullable: true }
        province: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        isActive: { type: boolean }
        paidUpCapital: { type: number, nullable: true }
        vatRate: { type: number, minimum: 0, maximum: 1, default: 0.07 }
        pnd30SubmissionMode: { type: string, enum: [manual, auto], default: manual }

    # === Canonical paper document (cont.121) — GET /{doc}/{id}/paper ===
    # JSON twin of the QuestPDF output (Accounting.Application/Pdf/PaperDocModel.cs,
    # mirror of frontend/components/paper/types.ts). Screen == print parity.
    PaperDoc:
      type: object
      required: [docType, docTypeEn, docNo, issueDate, seller, customer, items, summary, signRoles]
      properties:
        docType: { type: string, example: 'ใบกำกับภาษี', description: 'Thai document title' }
        docTypeEn: { type: string, example: 'TAX INVOICE' }
        docNo: { type: string }
        issueDate: { type: string, format: date }
        seller: { $ref: '#/components/schemas/PaperSeller' }
        customer: { $ref: '#/components/schemas/PaperCustomer' }
        items:
          type: array
          items: { $ref: '#/components/schemas/PaperLine' }
        summary: { $ref: '#/components/schemas/PaperSummary' }
        signRoles: { $ref: '#/components/schemas/PaperSignRoles' }
        validUntil: { type: string, format: date, nullable: true }
        validUntilLabel: { type: string, nullable: true }
        amountWords: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        watermark:
          allOf: [{ $ref: '#/components/schemas/PaperWatermark' }]
          nullable: true
        partyLabel:
          allOf: [{ $ref: '#/components/schemas/PaperPartyLabel' }]
          nullable: true
          description: 'Party-box label override (PO/PV = ผู้ขาย / Vendor); null → default ลูกค้า / Customer'
    PaperSeller:
      type: object
      description: 'Company logo (logo/logoSvg) is never serialized — the FE keeps its own logo source.'
      required: [name, taxId, branchCode, address]
      properties:
        name: { type: string }
        taxId: { type: string, description: '13-digit Tax ID' }
        branchCode: { type: string, description: '5-digit branch (00000 = HQ)' }
        address: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
    PaperCustomer:
      type: object
      required: [name]
      properties:
        name: { type: string }
        taxId: { type: string, nullable: true }
        branchCode: { type: string, nullable: true }
        address: { type: string, nullable: true }
        contact: { type: string, nullable: true }
        phone: { type: string, nullable: true }
    PaperLine:
      type: object
      required: [description, amount]
      properties:
        description: { type: string }
        descriptionSub: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        unit: { type: string, nullable: true }
        unitPrice: { type: number, nullable: true }
        discountPercent: { type: number, nullable: true }
        amount: { type: number }
    PaperSummary:
      type: object
      required: [subtotal, vat, total, showVat]
      properties:
        subtotal: { type: number }
        discount: { type: number, nullable: true }
        beforeVat: { type: number, nullable: true }
        vat: { type: number }
        total: { type: number, description: 'PV: WHT-deducted net (จ่ายสุทธิ)' }
        vatRate: { type: number, nullable: true, description: 'Percent, e.g. 7' }
        showVat: { type: boolean, default: true, description: 'false (non-VAT company) → foot prints a single Total row' }
        wht: { type: number, nullable: true, description: 'Payment Voucher only — หัก ณ ที่จ่าย row above the grand total' }
        nonTaxable: { type: number, nullable: true, description: 'Tax Invoice mixed taxable/exempt — exempt remainder row when > 0' }
    PaperSignRoles:
      type: object
      required: [left, right]
      properties:
        left: { type: string }
        right: { type: string }
        middle: { type: string, nullable: true, description: 'PV only — three-box strip; null → two-box layout' }
    PaperPartyLabel:
      type: object
      required: [th, en]
      properties:
        th: { type: string, example: 'ผู้ขาย' }
        en: { type: string, example: 'Vendor' }
    PaperWatermark:
      type: object
      required: [text, variant]
      properties:
        text: { type: string, example: 'สำเนา' }
        variant: { type: string, enum: [success, danger, warning, info] }

