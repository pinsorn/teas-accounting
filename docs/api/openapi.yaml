                  type: object
                  properties:
                    userId: { type: integer, format: int64 }
                    username: { type: string }
                    fullName: { type: string }
                    isActive: { type: boolean }
                    isSuperAdmin: { type: boolean }
                    roles:
                      type: array
                      items:
