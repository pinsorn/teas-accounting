  # GET /tax-filings/pnd30/pdf and GET /tax-filings/pnd30/batch-file.
  /tax-filings/pnd30:
    post:
      summary: ภ.พ.30 compute (preview) / finalize — Auto or Manual submission mode
      description: |
        `mode=preview` (default) computes without side effects; `mode=finalize`
        requires the tax.filing.finalize permission (GuardFinalizeAsync) and
