          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeV1'

  /tax-filings/pnd51/pdf:
    get:
      summary: ภ.ง.ด.51 (ม.67ทวิ method A) — mid-year CIT prepayment PDF
      description: >
        Fills the official RD ภ.ง.ด.51 AcroForm. estimatedProfit = taxpayer's full-year estimate
        (omit → H1 net profit × 2 from P&L). fillWorksheet=true additionally fills the page-2
        การคำนวณภาษี worksheet; ALL five attest* flags must then be true and the figures must foot
        (clean, general-rate, first filing) or the service returns 422
        `pnd51.worksheet_not_attestable` — a blank box on this form asserts zero (ภ.ง.ด.51 §4).
      tags: [Tax Filings]
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
          description: CE fiscal year (start year of the accounting period)
        - name: estimatedProfit
          in: query
          schema: { type: number }
        - name: whtH1
          in: query
          schema: { type: number, default: 0 }
        - name: isSme
          in: query
          schema: { type: boolean, default: false }
        - name: fillWorksheet
          in: query
          schema: { type: boolean, default: false }
        - name: attestFirstFiling
          in: query
          schema: { type: boolean, default: false }
          description: ยื่นปกติ ไม่ใช่ยื่นเพิ่มเติม (page-2 prior-paid box = 0)
        - name: attestNoLossCf
          in: query
          schema: { type: boolean, default: false }
          description: ไม่มีขาดทุนสุทธิยกมา (box 55 = 0)
        - name: attestNoExemption
          in: query
          schema: { type: boolean, default: false }
          description: ไม่มีกำไรที่ได้รับยกเว้น (box 56 = 0)
        - name: attestNoRateReduction
          in: query
          schema: { type: boolean, default: false }
          description: ไม่มีภาษีส่วนลดอัตรา (box 34 = 0)
        - name: attestNoSurcharge
          in: query
          schema: { type: boolean, default: false }
          description: ไม่มีเงินเพิ่ม ม.27/ม.67ตรี (box 38 = 0)
      responses:
        '200':
          description: PDF (2 pages; page 2 filled only when attested)
          content:
            application/pdf: {}
        '422':
          description: pnd51.worksheet_not_attestable — worksheet requested but not attestable/footing

  /tax-filings/pnd50/pdf:
    get:
      summary: ภ.ง.ด.50 (annual CIT return) C-D — p1-p6 + p7 header PDF
      description: >
        Fills the official RD ภ.ง.ด.50 AcroForm (C-D scope: page-1 header + page-2 การคำนวณภาษี +
        page-3 รายการที่ 2/3 ladder + page-4 รายการที่ 4-6 (zeros-by-design totals) + page-5
        รายการที่ 7 (GL expense partition) / รายการที่ 8 (positive adjustments) + page-6
        งบแสดงฐานะการเงิน + page-7 director-statement header — all from real data; column ③ only,
        explicit zeros). Figures come from the CIT data layer (CitProfile, per-account FY expenses,
        ภ.ง.ด.51 estimate/prepaid store, FY WHT-receivable register, BalanceSheet, CitCalculator +
        ม.67ตรี penalty). Both attest flags must be true (the p7 director questions/signatures and
        the separate ใบแนบ ก-จ still print blank → 422 `pnd50.not_attestable`), and the year must
        carry no blocking refusal (`pnd50.override_breaks_ladder`, `pnd50.ladder_sign_flip`,
        `pnd50.surcharge_with_overpaid`, `pnd50.schedule_breaks_ladder`) or the service returns
        422 `pnd50.not_renderable`. `pnd50.disclosure_required` (revenue > ฿200M, ม.71ทวิ TP
        disclosure filed separately) is informational and does NOT block this endpoint.
        A blank box on this form asserts zero (ภ.ง.ด.50 §4).
      tags: [Tax Filings]
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
          description: CE fiscal year (start year of the accounting period)
        - name: isSme
          in: query
          schema: { type: boolean, nullable: true }
          description: omit → auto from CitProfile (paid-up ≤5M ∧ revenue ≤30M)
        - name: hasRelatedParty
          in: query
          schema: { type: boolean, default: false }
          description: ม.71ทวิ related-party radio (มี → annual disclosure report required)
        - name: attestFirstFiling
          in: query
          schema: { type: boolean, default: false }
          description: ยื่นปกติ ครั้งแรก (ไม่ใช่ยื่นเพิ่มเติม)
        - name: attestBlankSchedules
          in: query
          schema: { type: boolean, default: false }
          description: รับทราบว่า คำถาม/ลายเซ็นหน้า 7 และใบแนบ ก-จ พิมพ์ว่าง ต้องกรอกเองก่อนยื่นจริง
      responses:
        '200':
          description: PDF (7 pages; C-D fills pages 1–6 + page-7 header)
          content:
            application/pdf: {}
        '422':
          description: pnd50.not_attestable (attestation missing) or pnd50.not_renderable (refusal condition)

  /tax-filings/pnd50/preview:
    get:
      summary: ภ.ง.ด.50 dashboard dry-run — every figure the filler will print (single source)
      description: >
        JSON preview for the CIT filing dashboard, derived from the SAME composition the PDF filler
        uses (no duplicated maths). Never 422s for a refusal: those are listed in `refusals[]` (the
        /pdf endpoint 422s on the same codes, except informational `pnd50.disclosure_required`).
        `ladder`/`expenseSchedule`/`disallowed` are null only when a refusal prevented building
        them. Includes the p3 ladder, the p5 รายการที่ 7/8 schedules, p6 balance-sheet totals, the
        per-certificate WHT credit (50ทวิ), the ภ.ง.ด.51 estimate/prepaid, and the ม.67ตรี surcharge.
      tags: [Tax Filings]
      parameters:
        - name: year
